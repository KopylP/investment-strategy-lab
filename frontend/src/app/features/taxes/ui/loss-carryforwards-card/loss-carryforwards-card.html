<div class="card">
  <h2 class="text-lg font-semibold mb-2">Збитки минулих років</h2>
  <p class="text-sm text-muted-color mt-0 mb-2">
    Ваші, а не рахунку: один запис на рік для всіх брокерів.
  </p>
  <p class="text-sm sm:text-base text-muted-color mt-0 mb-4">
    {{ regime.regime()?.lossesNote }}
  </p>
  @if (store.losses().length) {
    <p-table [value]="store.losses()" size="small" styleClass="mb-4">
      <ng-template #header
        ><tr>
          <th>Рік</th>
          <th class="text-right">Збиток</th>
          <th class="text-right">Використано<span class="hidden sm:inline"> раніше</span></th>
          <th class="w-12"></th></tr
      ></ng-template>
      <ng-template #body let-loss>
        <tr>
          <td>{{ loss.year }}</td>
          <td class="text-right">{{ loss.amount | taxMoney }}</td>
          <td class="text-right">{{ loss.alreadyUsed | taxMoney }}</td>
          <td>
            <p-button
              icon="pi pi-trash"
              [text]="true"
              severity="danger"
              ariaLabel="Видалити"
              (onClick)="confirmRemove(loss)"
            />
          </td>
        </tr>
      </ng-template>
    </p-table>
  }
  <div class="grid grid-cols-2 gap-3 sm:flex sm:flex-wrap sm:items-end">
    <div class="flex flex-col gap-2">
      <label for="loss-year" class="font-medium text-sm">Рік</label>
      <p-inputnumber
        inputId="loss-year"
        [ngModel]="lossYear()"
        (ngModelChange)="lossYear.set($event)"
        [useGrouping]="false"
        [min]="2000"
        [max]="2100"
        fluid
      />
    </div>
    <div class="flex flex-col gap-2">
      <label for="loss-amount" class="font-medium text-sm">Збиток</label>
      <p-inputnumber
        inputId="loss-amount"
        [ngModel]="lossAmount()"
        (ngModelChange)="lossAmount.set($event)"
        mode="currency"
        currency="PLN"
        locale="uk-UA"
        [min]="0"
        fluid
      />
    </div>
    <div class="flex flex-col gap-2">
      <label for="loss-used" class="font-medium text-sm">Уже використано</label>
      <p-inputnumber
        inputId="loss-used"
        [ngModel]="lossUsed()"
        (ngModelChange)="lossUsed.set($event)"
        mode="currency"
        currency="PLN"
        locale="uk-UA"
        [min]="0"
        fluid
      />
    </div>
    <p-button
      label="Додати"
      icon="pi pi-plus"
      [disabled]="!lossYear() || !lossAmount()"
      [loading]="store.saving()"
      (onClick)="addLoss()"
      class="self-end"
      styleClass="w-full sm:w-auto"
    />
  </div>
</div>
