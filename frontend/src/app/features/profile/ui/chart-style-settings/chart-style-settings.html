<div class="card max-w-2xl">
  <h2 class="text-lg font-semibold mb-1">{{ 'profile.chartStyle.title' | transloco }}</h2>
  <p class="text-muted-color mb-4">{{ 'profile.chartStyle.hint' | transloco }}</p>

  @if (selected(); as current) {
    <p-selectbutton
      [options]="options()"
      optionLabel="label"
      optionValue="value"
      [ngModel]="current"
      (ngModelChange)="choose($event)"
      [allowEmpty]="false"
      [disabled]="saving()"
      [ariaLabel]="'profile.chartStyle.title' | transloco"
    />
  } @else {
    <p-skeleton height="2.5rem" width="16rem" />
  }
</div>
