<app-page-header title="Профіль" [subtitle]="auth.user()?.email ?? ''" />

<div class="card max-w-2xl">
  @if (profile(); as current) {
    <div class="flex flex-col gap-5">
      <div class="flex flex-col gap-2">
        <label for="locale" class="font-medium">Мова</label>
        <p-select inputId="locale" [options]="locales" optionLabel="label" optionValue="value" [ngModel]="current.locale" (ngModelChange)="patch({ locale: $event })" fluid />
      </div>
      <div class="flex flex-col gap-2">
        <label for="zone" class="font-medium">Часовий пояс</label>
        <p-select inputId="zone" [options]="timeZones" optionLabel="label" optionValue="value" [ngModel]="current.timeZone" (ngModelChange)="patch({ timeZone: $event })" [editable]="true" fluid />
      </div>
      <div class="flex justify-end">
        <p-button label="Зберегти" icon="pi pi-save" [loading]="saving()" (onClick)="save()" />
      </div>
    </div>
  } @else {
    <p-skeleton height="12rem" />
  }
</div>
