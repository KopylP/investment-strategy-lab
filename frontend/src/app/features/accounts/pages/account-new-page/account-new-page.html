<app-page-header
  backLink="/accounts"
  backLabel="Рахунки"
  title="Новий рахунок"
  subtitle="Кілька кроків — і сервіс щомісяця підказуватиме, що купити в брокера"
/>

<p-stepper [value]="draft.step()" (valueChange)="draft.step.set($any($event))" [linear]="true">
  <p-step-list>
    <p-step [value]="1">Рахунок</p-step>
    <p-step [value]="2">Як розділити гроші</p-step>
    <p-step [value]="3">Внески</p-step>
    <p-step [value]="4">Рапорти</p-step>
    <p-step [value]="5">Перевірка</p-step>
    <p-step [value]="6">Готово</p-step>
  </p-step-list>

  <p-step-panels>
    <p-step-panel [value]="1">
      <ng-template #content>
        <app-new-account-step-account />
      </ng-template>
    </p-step-panel>

    <p-step-panel [value]="2">
      <ng-template #content>
        <app-new-account-step-sleeves />
      </ng-template>
    </p-step-panel>

    <p-step-panel [value]="3">
      <ng-template #content>
        <app-new-account-step-contributions />
      </ng-template>
    </p-step-panel>

    <p-step-panel [value]="4">
      <ng-template #content>
        <app-new-account-step-reports />
      </ng-template>
    </p-step-panel>

    <p-step-panel [value]="5">
      <ng-template #content>
        <app-new-account-step-review />
      </ng-template>
    </p-step-panel>

    <p-step-panel [value]="6">
      <ng-template #content>
        <app-new-account-step-done />
      </ng-template>
    </p-step-panel>
  </p-step-panels>
</p-stepper>
