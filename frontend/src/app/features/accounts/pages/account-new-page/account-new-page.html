<app-page-header
  backLink="/accounts"
  [backLabel]="'routes.accounts' | transloco"
  [title]="'routes.newAccount' | transloco"
  [subtitle]="'accounts.wizard.subtitle' | transloco"
/>

<p-stepper [value]="draft.step()" (valueChange)="draft.step.set($any($event))" [linear]="true">
  <p-step-list>
    <p-step [value]="1">{{ 'accounts.wizard.step.account' | transloco }}</p-step>
    <p-step [value]="2">{{ 'accounts.wizard.step.sleeves' | transloco }}</p-step>
    <p-step [value]="3">{{ 'accounts.wizard.step.contributions' | transloco }}</p-step>
    <p-step [value]="4">{{ 'accounts.wizard.step.reports' | transloco }}</p-step>
    <p-step [value]="5">{{ 'accounts.wizard.step.review' | transloco }}</p-step>
    <p-step [value]="6">{{ 'accounts.wizard.step.done' | transloco }}</p-step>
  </p-step-list>

  <p-step-panels>
    <p-step-panel [value]="1">
      <ng-template #content>
        <app-new-account-step-account />
      </ng-template>
    </p-step-panel>

    <p-step-panel [value]="2">
      <ng-template #content>
        <app-new-account-step-sleeves />
      </ng-template>
    </p-step-panel>

    <p-step-panel [value]="3">
      <ng-template #content>
        <app-new-account-step-contributions />
      </ng-template>
    </p-step-panel>

    <p-step-panel [value]="4">
      <ng-template #content>
        <app-new-account-step-reports />
      </ng-template>
    </p-step-panel>

    <p-step-panel [value]="5">
      <ng-template #content>
        <app-new-account-step-review />
      </ng-template>
    </p-step-panel>

    <p-step-panel [value]="6">
      <ng-template #content>
        <app-new-account-step-done />
      </ng-template>
    </p-step-panel>
  </p-step-panels>
</p-stepper>
