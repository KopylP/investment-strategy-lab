<div class="card">
  <p-message severity="secondary" styleClass="mb-5">
    <div>
      <b>{{ 'accounts.wizard.contributions.contribution' | transloco }}</b> {{ 'accounts.wizard.contributions.hint' | transloco }}
    </div>
    <div class="mt-2">
      <i class="pi pi-pencil mr-1"></i>{{ 'accounts.wizard.contributions.where' | transloco }}<b>{{ 'accounts.settingsAccounts' | transloco }}</b>).
    </div>
  </p-message>
  <div class="flex flex-col gap-2 max-w-sm">
    <label for="contribution" class="font-medium">{{ 'accounts.plan.monthlyContribution' | transloco }}</label>
    <p-inputnumber
      inputId="contribution"
      [ngModel]="draft.plan().monthlyContribution"
      (ngModelChange)="draft.plan.set({ ...draft.plan(), monthlyContribution: $event ?? 0 })"
      mode="currency"
      [currency]="draft.currency()"
      locale="uk-UA"
      [min]="0"
      fluid
    />
  </div>
  <button
    type="button"
    class="mt-5 p-0 border-0 bg-transparent text-primary cursor-pointer"
    (click)="draft.showAdvanced.set(!draft.showAdvanced())"
  >
    <i
      class="pi mr-1"
      [class.pi-chevron-down]="!draft.showAdvanced()"
      [class.pi-chevron-up]="draft.showAdvanced()"
    ></i
    >{{ 'accounts.wizard.contributions.extra' | transloco }}
  </button>
  @if (draft.showAdvanced()) {
    <div class="mt-4">
      <app-plan-settings-form
        [settings]="draft.plan()"
        (settingsChange)="draft.plan.set($event)"
        [currency]="draft.currency()"
        [showPolicy]="draft.sleeves().length > 1"
      />
    </div>
  }
  <div class="flex justify-between mt-6">
    <p-button
      [label]="'common.back' | transloco"
      icon="pi pi-arrow-left"
      severity="secondary"
      [text]="true"
      (onClick)="draft.step.set(2)"
    />
    <p-button [label]="'common.next' | transloco" icon="pi pi-arrow-right" iconPos="right" (onClick)="draft.step.set(4)" />
  </div>
</div>
