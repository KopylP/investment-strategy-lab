<p-dialog
  [header]="'accounts.rename.title' | transloco"
  [modal]="true"
  [visible]="!!subPortfolio()"
  (visibleChange)="!$event && subPortfolio.set(null)"
  [style]="{ width: '28rem' }"
  [breakpoints]="{ '768px': '95vw' }"
>
  <form class="flex flex-col gap-4" (ngSubmit)="save()">
    <input
      pInputText
      name="name"
      [attr.aria-label]="'accounts.rename.title' | transloco"
      maxlength="100"
      [ngModel]="name()"
      (ngModelChange)="name.set($event)"
    />
    <div class="flex justify-end gap-2">
      <p-button
        [label]="'common.cancel' | transloco"
        severity="secondary"
        [text]="true"
        (onClick)="subPortfolio.set(null)"
      />
      <p-button
        [label]="'common.save' | transloco"
        type="submit"
        [disabled]="!canSave()"
        [loading]="store.busy() === 'rename-' + subPortfolio()?.id"
      />
    </div>
  </form>
</p-dialog>
