<p-dialog
  [header]="'accounts.addSub.title' | transloco"
  [modal]="true"
  [visible]="visible()"
  (visibleChange)="visible.set($event)"
  [style]="{ width: '34rem' }"
  [breakpoints]="{ '640px': '95vw' }"
>
  <div class="flex flex-col gap-4">
    <div class="flex flex-col gap-2">
      <label for="sub-name" class="font-medium">{{ 'signals.editor.name' | transloco }}</label>
      <input
        pInputText
        id="sub-name"
        [ngModel]="draft().name"
        (ngModelChange)="patchDraft({ name: $event })"
      />
    </div>
    <div class="flex flex-col gap-2">
      <label for="sub-share" class="font-medium">{{
        'accounts.addSub.targetShare' | transloco
      }}</label>
      <p-inputnumber
        inputId="sub-share"
        [ngModel]="draft().share"
        (ngModelChange)="patchDraft({ share: $event ?? 0 })"
        suffix=" %"
        [min]="1"
        [max]="99"
        fluid
      />
      <small class="text-muted-color">{{ 'accounts.addSub.targetShareHint' | transloco }}</small>
    </div>
    <div class="flex flex-col gap-2">
      <label for="sub-strategy" class="font-medium">{{ 'routes.strategy' | transloco }}</label>
      <app-strategy-picker
        [strategies]="store.strategies()"
        [value]="draft().strategyId"
        [compact]="true"
        (valueChange)="patchDraft({ strategyId: $event })"
      />
    </div>
    <div class="flex flex-col gap-2">
      <label for="sub-cash" class="font-medium">{{
        'strategies.detail.parkingEtf' | transloco
      }}</label>
      <p-select
        inputId="sub-cash"
        [options]="cashOptions()"
        optionLabel="label"
        optionValue="value"
        [ngModel]="draft().cashInstrumentId"
        (ngModelChange)="patchDraft({ cashInstrumentId: $event })"
        [showClear]="true"
        [filter]="true"
        [placeholder]="'accounts.asInStrategyLabel' | transloco"
        appendTo="body"
        fluid
      />
    </div>
  </div>
  <ng-template #footer>
    <p-button
      [label]="'common.cancel' | transloco"
      [text]="true"
      severity="secondary"
      (onClick)="visible.set(false)"
    />
    <p-button
      [label]="'common.add' | transloco"
      icon="pi pi-plus"
      [disabled]="!draft().name.trim()"
      [loading]="store.busy() === 'add'"
      (onClick)="add()"
    />
  </ng-template>
</p-dialog>
