<div class="grid gap-5 md:grid-cols-2">
  <div class="flex flex-col gap-2">
    <label for="contribution" class="font-medium">{{ 'accounts.plan.monthlyContribution' | transloco }}</label>
    <p-inputnumber
      inputId="contribution"
      [ngModel]="settings().monthlyContribution"
      (ngModelChange)="set('monthlyContribution', $event ?? 0)"
      mode="currency"
      [currency]="currency()"
      locale="uk-UA"
      [min]="0"
      fluid
    />
    <small class="text-muted-color"
      >{{ 'accounts.plan.monthlyContributionHint' | transloco }}</small
    >
  </div>
  @if (showPolicy()) {
    <div class="flex flex-col gap-2">
      <span class="font-medium">{{ 'accounts.plan.splitHow' | transloco }}</span>
      <p-selectbutton
        [options]="policies"
        optionLabel="label"
        optionValue="value"
        [ngModel]="settings().contributionPolicy"
        (ngModelChange)="$event && set('contributionPolicy', $event)"
        [allowEmpty]="false"
      />
      <small class="text-muted-color"
        >{{ 'accounts.plan.splitHint' | transloco }}</small
      >
    </div>
  }
  <div class="flex flex-col gap-2">
    <label for="minTrade" class="font-medium flex items-center gap-1">
      {{ 'accounts.plan.minTrade' | transloco }}
      <i
        class="pi pi-info-circle text-xs text-muted-color"
        [pTooltip]="'accounts.plan.minTradeHint' | transloco"
      ></i>
    </label>
    <p-inputnumber
      inputId="minTrade"
      [ngModel]="settings().minTrade"
      (ngModelChange)="set('minTrade', $event ?? 0)"
      mode="currency"
      [currency]="currency()"
      locale="uk-UA"
      [min]="0"
      fluid
    />
  </div>
  <div class="flex flex-col gap-2">
    <label for="trimBand" class="font-medium flex items-center gap-1">
      {{ 'accounts.plan.trimBand' | transloco }}
      <i
        class="pi pi-info-circle text-xs text-muted-color"
        [pTooltip]="'accounts.plan.trimBandHint' | transloco"
      ></i>
    </label>
    <p-inputnumber
      inputId="trimBand"
      [ngModel]="settings().trimBandPercent"
      (ngModelChange)="set('trimBandPercent', $event ?? 0)"
      suffix=" %"
      [min]="0"
      [max]="100"
      fluid
    />
  </div>
  @if (showPolicy()) {
    <div class="flex flex-col gap-2">
      <label for="drift" class="font-medium flex items-center gap-1">
        {{ 'accounts.plan.driftBand' | transloco }}
        <i
          class="pi pi-info-circle text-xs text-muted-color"
          [pTooltip]="'accounts.plan.driftBandHint' | transloco"
        ></i>
      </label>
      <p-inputnumber
        inputId="drift"
        [ngModel]="settings().driftBandPercent"
        (ngModelChange)="set('driftBandPercent', $event ?? 0)"
        suffix=" %"
        [min]="0"
        [max]="100"
        fluid
      />
    </div>
  }
  <div class="flex flex-col gap-3">
    <label class="flex items-center gap-3">
      <p-toggleswitch
        class="shrink-0"
        [ngModel]="settings().allowFractionalShares"
        (ngModelChange)="set('allowFractionalShares', $event)"
      />
      <span>{{ 'accounts.plan.fractional' | transloco }}</span>
    </label>
    <label class="flex items-center gap-3">
      <p-toggleswitch
        class="shrink-0"
        [ngModel]="settings().levelByPurchasesOnly"
        (ngModelChange)="set('levelByPurchasesOnly', $event)"
      />
      <span
        >{{ 'accounts.plan.buyOnly' | transloco }}</span
      >
    </label>
    <label class="flex items-center gap-3">
      <p-toggleswitch
        class="shrink-0"
        [ngModel]="settings().generateOnSchedule"
        (ngModelChange)="set('generateOnSchedule', $event)"
      />
      <span>{{ 'accounts.plan.autoReports' | transloco }}</span>
    </label>
  </div>
</div>
