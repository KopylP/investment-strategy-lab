<div class="grid gap-5 md:grid-cols-2">
  <div class="flex flex-col gap-2">
    <label for="contribution" class="font-medium">Щомісячний внесок</label>
    <p-inputnumber inputId="contribution" [ngModel]="settings().monthlyContribution" (ngModelChange)="set('monthlyContribution', $event ?? 0)"
                   mode="currency" [currency]="currency()" locale="uk-UA" [min]="0" fluid />
    <small class="text-muted-color">Пропонується в кожному щомісячному рапорті; суму можна змінити при генерації.</small>
  </div>
  @if (showPolicy()) {
    <div class="flex flex-col gap-2">
      <span class="font-medium">Як ділити внесок між під-портфелями</span>
      <p-selectbutton [options]="policies" optionLabel="label" optionValue="value" [ngModel]="settings().contributionPolicy"
                      (ngModelChange)="$event && set('contributionPolicy', $event)" [allowEmpty]="false" />
      <small class="text-muted-color">«Тому, хто відстає» тримає частки без продажів; «За частками» — завжди однаково.</small>
    </div>
  }
  <div class="flex flex-col gap-2">
    <label for="minTrade" class="font-medium flex items-center gap-1">
      Мінімальна угода <i class="pi pi-info-circle text-xs text-muted-color" pTooltip="Дрібніші покупки пропускаються, гроші паркуються"></i>
    </label>
    <p-inputnumber inputId="minTrade" [ngModel]="settings().minTrade" (ngModelChange)="set('minTrade', $event ?? 0)" mode="currency" [currency]="currency()" locale="uk-UA" [min]="0" fluid />
  </div>
  <div class="flex flex-col gap-2">
    <label for="trimBand" class="font-medium flex items-center gap-1">
      Поріг зменшення переможця, % <i class="pi pi-info-circle text-xs text-muted-color" pTooltip="Позицію в плюсі продають до цілі, лише коли вона перевищує ціль більше, ніж на стільки відсотків портфеля"></i>
    </label>
    <p-inputnumber inputId="trimBand" [ngModel]="settings().trimBandPercent" (ngModelChange)="set('trimBandPercent', $event ?? 0)" suffix=" %" [min]="0" [max]="100" fluid />
  </div>
  @if (showPolicy()) {
    <div class="flex flex-col gap-2">
      <label for="drift" class="font-medium flex items-center gap-1">
        Допустиме відхилення часток, % <i class="pi pi-info-circle text-xs text-muted-color" pTooltip="Більше відхилення — рапорт підкаже внутрішній переказ між під-портфелями"></i>
      </label>
      <p-inputnumber inputId="drift" [ngModel]="settings().driftBandPercent" (ngModelChange)="set('driftBandPercent', $event ?? 0)" suffix=" %" [min]="0" [max]="100" fluid />
    </div>
  }
  <div class="flex flex-col gap-3">
    <label class="flex items-center gap-3">
      <p-toggleswitch [ngModel]="settings().allowFractionalShares" (ngModelChange)="set('allowFractionalShares', $event)" />
      <span>Дробові акції (брокер дозволяє купувати частину ETF)</span>
    </label>
    <label class="flex items-center gap-3">
      <p-toggleswitch [ngModel]="settings().generateOnSchedule" (ngModelChange)="set('generateOnSchedule', $event)" />
      <span>Рапорт першої неділі місяця й ризик щонеділі — автоматично</span>
    </label>
  </div>
</div>
