@if (error()) {
  <p-message severity="error" [text]="'builder.published.loadFailed' | transloco" />
}
@if (published(); as strategy) {
  @if (strategy.editable) {
    <div class="my-4"><app-builder-words-panel [words]="strategy.words" /></div>
    <p-button
      [label]="'builder.published.editInBuilder' | transloco"
      icon="pi pi-pencil"
      [loading]="opening()"
      (onClick)="open()"
    />
  }
}
