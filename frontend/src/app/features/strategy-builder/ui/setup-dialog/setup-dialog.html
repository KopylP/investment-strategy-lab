@if (inline()) {
  <ng-container *ngTemplateOutlet="fields" />
} @else {
  <p-dialog
    [header]="'builder.graph.visual.setup' | transloco"
    [modal]="true"
    [visible]="visible()"
    (visibleChange)="visible.set($event)"
    [style]="{ width: '44rem' }"
    [breakpoints]="{ '760px': '95vw' }"
  >
    <ng-container *ngTemplateOutlet="fields" />

    <ng-template #footer>
      <p-button
        [label]="'common.cancel' | transloco"
        [text]="true"
        severity="secondary"
        (onClick)="visible.set(false)"
      />
      <p-button [label]="'common.save' | transloco" icon="pi pi-check" (onClick)="save()" />
    </ng-template>
  </p-dialog>
}
<ng-template #fields>
  <div class="flex min-w-0 flex-col gap-4">
    <div class="flex flex-col gap-2">
      <div class="flex items-center justify-between gap-3">
        <span class="font-medium">{{ 'builder.setup.universe' | transloco }}</span>
        <small class="text-muted-color">{{
          'builder.setup.fundsCount' | transloco: { funds: draft().funds.length }
        }}</small>
      </div>
      <p-button
        [label]="'builder.setup.chooseFundsCount' | transloco: { count: draft().funds.length }"
        [ariaLabel]="'builder.setup.chooseFunds' | transloco"
        icon="pi pi-folder-open"
        severity="secondary"
        [outlined]="true"
        (onClick)="fundSearchVisible.set(true)"
      />
    </div>

    <div class="grid grid-cols-[minmax(0,1fr)] gap-4 md:grid-cols-[minmax(0,1fr)_minmax(0,1fr)]">
      <div class="flex min-w-0 flex-col gap-2">
        <label for="builder-benchmark" class="font-medium">{{
          'strategies.detail.benchmark' | transloco
        }}</label>
        <p-select
          inputId="builder-benchmark"
          [options]="regularOptions()"
          optionLabel="label"
          optionValue="value"
          [ngModel]="draft().benchmarkId"
          (ngModelChange)="patch({ benchmarkId: $event })"
          [filter]="true"
          [showClear]="true"
          appendTo="body"
          fluid
        />
      </div>
      <div class="flex min-w-0 flex-col gap-2">
        <label for="builder-cash" class="font-medium">{{
          'builder.graph.node.series.cash' | transloco
        }}</label>
        <p-select
          inputId="builder-cash"
          [options]="regularOptions()"
          optionLabel="label"
          optionValue="value"
          [ngModel]="draft().cashId"
          (ngModelChange)="patch({ cashId: $event })"
          [filter]="true"
          [showClear]="true"
          appendTo="body"
          fluid
        />
      </div>
      <div class="flex min-w-0 flex-col gap-2">
        <label for="builder-volatility" class="font-medium">{{
          'strategies.detail.volatilityIndex' | transloco
        }}</label>
        <p-select
          inputId="builder-volatility"
          [options]="volatilityOptions()"
          optionLabel="label"
          optionValue="value"
          [ngModel]="draft().volatilityIndexId"
          (ngModelChange)="patch({ volatilityIndexId: $event })"
          [filter]="true"
          [showClear]="true"
          [placeholder]="'builder.setup.optional' | transloco"
          appendTo="body"
          fluid
        />
      </div>
      <div class="flex min-w-0 flex-col gap-2">
        <label for="builder-extra" class="font-medium">{{
          'builder.setup.extraSeries' | transloco
        }}</label>
        <p-multiselect
          inputId="builder-extra"
          [options]="regularOptions()"
          optionLabel="label"
          optionValue="value"
          [ngModel]="draft().extraSeries"
          (ngModelChange)="patch({ extraSeries: $event })"
          [filter]="true"
          [placeholder]="'builder.setup.optional' | transloco"
          appendTo="body"
          fluid
        />
      </div>
    </div>
  </div>
</ng-template>

<app-fund-selection-dialog
  [(visible)]="fundSearchVisible"
  [instruments]="instruments()"
  [value]="draft().funds"
  (applied)="patch({ funds: $event })"
  (instrumentsChanged)="instrumentsChanged.emit()"
/>
