<p-dialog
  [header]="'signals.subject.header' | transloco"
  [modal]="true"
  [(visible)]="visible"
  [style]="{ width: '32rem' }"
  [breakpoints]="{ '640px': '95vw' }"
>
  <div class="flex flex-col gap-3">
    <p-selectbutton
      [options]="tabs"
      optionLabel="label"
      optionValue="value"
      [ngModel]="tab()"
      (ngModelChange)="changeTab($event)"
      [allowEmpty]="false"
      size="small"
    />

    <p-iconfield>
      <p-inputicon styleClass="pi pi-search" />
      <input
        pInputText
        type="search"
        [attr.aria-label]="'common.search' | transloco"
        [placeholder]="isInstrumentTab() ? ('instruments.search' | transloco) : ('signals.subject.groupName' | transloco)"
        [ngModel]="search()"
        (ngModelChange)="search.set($event)"
        class="w-full"
      />
    </p-iconfield>

    <ul class="list-none m-0 p-0 h-96 max-h-[60vh] overflow-y-auto">
      @if (isInstrumentTab()) {
        @for (instrument of visibleInstruments(); track instrument.id) {
          <li>
            <button
              type="button"
              class="w-full text-left px-3 py-2 min-h-11 border-0 border-b border-surface bg-transparent
                cursor-pointer text-color hover:bg-emphasis transition-colors"
              [class.bg-emphasis]="chosenInstrumentId() === instrument.id"
              (click)="pickInstrument(instrument.id)"
            >
              <span class="font-semibold">{{ instrument.label }}</span>
              <span class="text-sm text-muted-color"> · {{ instrument.name }}</span>
              <span class="block text-xs text-muted-color">
                {{ kindLabel(instrument.kind) }}
                @if (instrument.group; as group) {
                  · {{ group }}
                }
              </span>
            </button>
          </li>
        } @empty {
          <li class="p-3 text-muted-color">{{ 'common.nothingFound' | transloco }}</li>
        }
      } @else {
        @for (group of visibleGroups(); track group.name) {
          <li>
            <button
              type="button"
              class="w-full text-left px-3 py-2 min-h-11 border-0 border-b border-surface bg-transparent
                cursor-pointer text-color hover:bg-emphasis transition-colors"
              [class.bg-emphasis]="chosenGroupName() === group.name"
              (click)="pickGroup(group.name)"
            >
              <span class="font-semibold">{{ group.name }}</span>
              <span class="block text-xs text-muted-color">
                {{ 'signals.subject.instrumentCount' | transloco: { instrumentCount: group.instrumentCount } }}
              </span>
            </button>
          </li>
        } @empty {
          <li class="p-3 text-muted-color">{{ 'common.nothingFound' | transloco }}</li>
        }
      }
    </ul>
  </div>
</p-dialog>
