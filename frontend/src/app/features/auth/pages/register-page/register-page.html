<div class="bg-surface-50 dark:bg-surface-950 flex items-center justify-center min-h-screen px-4">
  <div class="w-full max-w-md bg-surface-0 dark:bg-surface-900 rounded-2xl shadow-sm p-8 sm:p-10">
    <div class="text-center mb-8">
      <i class="pi pi-chart-scatter text-primary text-4xl mb-4"></i>
      <h1 class="text-2xl font-semibold m-0">Новий обліковий запис</h1>
      <p class="text-muted-color mt-2 mb-0">
        Пароль — від 10 символів; фраза з кількох слів підходить найкраще
      </p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-5">
      <div class="flex flex-col gap-2">
        <label for="email" class="font-medium">Email</label>
        <input
          pInputText
          id="email"
          type="email"
          formControlName="email"
          autocomplete="email"
          fluid
        />
      </div>
      <div class="flex flex-col gap-2">
        <label for="password" class="font-medium">Пароль</label>
        <p-password
          inputId="password"
          formControlName="password"
          [toggleMask]="true"
          autocomplete="new-password"
          fluid
        />
        @if (form.controls.password.touched && form.controls.password.hasError('minlength')) {
          <p-message severity="error" size="small" variant="simple" text="Щонайменше 10 символів" />
        }
      </div>
      <div class="flex flex-col gap-2">
        <label for="confirm" class="font-medium">Ще раз</label>
        <p-password
          inputId="confirm"
          formControlName="confirm"
          [feedback]="false"
          [toggleMask]="true"
          autocomplete="new-password"
          fluid
        />
        @if (form.controls.confirm.touched && form.hasError('mismatch')) {
          <p-message severity="error" size="small" variant="simple" text="Паролі не збігаються" />
        }
      </div>

      @if (error()) {
        <p-message severity="error" [text]="error()!" />
      }

      <p-button
        type="submit"
        label="Зареєструватися"
        icon="pi pi-user-plus"
        [loading]="busy()"
        fluid
      />
      <div class="text-center text-sm">
        Уже є обліковий запис?
        <a routerLink="/auth/login" class="text-primary font-medium">Увійти</a>
      </div>
    </form>
  </div>
</div>
