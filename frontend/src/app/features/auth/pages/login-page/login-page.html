<div class="bg-surface-50 dark:bg-surface-950 flex items-center justify-center min-h-screen px-4">
  <div class="w-full max-w-md bg-surface-0 dark:bg-surface-900 rounded-2xl shadow-sm p-8 sm:p-10">
    <div class="text-center mb-8">
      <i class="pi pi-chart-scatter text-primary text-4xl mb-4"></i>
      <h1 class="text-2xl font-semibold m-0">Investment Lab</h1>
      @if (inHomeAssistantPanel) {
        <p class="text-muted-color mt-2 mb-0">
          Увійдіть один раз — далі Home Assistant входитиме за вас
        </p>
      } @else {
        <p class="text-muted-color mt-2 mb-0">Увійдіть, щоб побачити рапорт місяця</p>
      }
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-5">
      <div class="flex flex-col gap-2">
        <label for="email" class="font-medium">Email</label>
        <input
          pInputText
          id="email"
          type="email"
          formControlName="email"
          autocomplete="email"
          fluid
        />
      </div>
      <div class="flex flex-col gap-2">
        <label for="password" class="font-medium">Пароль</label>
        <p-password
          inputId="password"
          formControlName="password"
          [feedback]="false"
          [toggleMask]="true"
          autocomplete="current-password"
          fluid
        />
      </div>

      @if (error()) {
        <p-message severity="error" [text]="error()!" />
      }

      <p-button type="submit" label="Увійти" icon="pi pi-sign-in" [loading]="busy()" fluid />
      <div class="text-center text-sm">
        Немає облікового запису?
        <a routerLink="/auth/register" class="text-primary font-medium">Зареєструватися</a>
      </div>
    </form>
  </div>
</div>
