<app-page-header
  [title]="'holdings.title' | transloco"
  [subtitle]="
    store.isAll()
      ? ('holdings.subtitleAll' | transloco: { currency: store.currency() })
      : ('holdings.subtitle' | transloco)
  "
>
  <p-datepicker
    [ngModel]="store.asOf()"
    (ngModelChange)="store.asOf.set($event)"
    [placeholder]="'holdings.today' | transloco"
    dateFormat="dd.mm.yy"
    [showIcon]="true"
    [showClear]="true"
    [maxDate]="today"
  />
</app-page-header>

@if (store.isLoading() && !store.sleeves().length) {
  <div class="card"><p-skeleton height="12rem" /></div>
} @else if (store.loadError()) {
  <div class="card"><p-message severity="error" [text]="'holdings.loadFailed' | transloco" /></div>
} @else if (!store.account()) {
  <div class="card">
    <app-empty-state icon="pi pi-wallet" [title]="'holdings.noAccount' | transloco"
      ><p-button [label]="'holdings.openAccount' | transloco" routerLink="/accounts/new"
    /></app-empty-state>
  </div>
} @else {
  @let totals = store.totals();
  <app-holdings-summary-card [totals]="totals" />

  <app-holdings-tiles [totals]="totals" />

  @if (store.exposure().length) {
    <app-holdings-exposure-card [breakdowns]="store.exposure()" [currency]="store.currency()" />
  }

  @if (store.staleQuotes()) {
    <p-message
      severity="warn"
      styleClass="mb-4"
      [text]="'holdings.staleQuotes' | transloco"
    />
  }

  @for (sleeve of store.sleeves(); track sleeve.id) {
    <app-holdings-sleeve-card [sleeve]="sleeve" />
  } @empty {
    <div class="card">
      <app-empty-state
        icon="pi pi-chart-pie"
        [title]="'holdings.empty' | transloco"
        [text]="'holdings.emptyHint' | transloco"
      />
    </div>
  }
}
