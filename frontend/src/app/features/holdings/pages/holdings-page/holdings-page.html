<app-page-header
  title="Позиції"
  [subtitle]="
    store.isAll()
      ? 'Усі рахунки разом у ' + store.currency() + ' (офіційний курс) · лоти FIFO по під-портфелях'
      : 'Віртуальні лоти FIFO по під-портфелях за останніми котируваннями'
  "
>
  <p-datepicker
    [ngModel]="store.asOf()"
    (ngModelChange)="store.asOf.set($event)"
    placeholder="Сьогодні"
    dateFormat="dd.mm.yy"
    [showIcon]="true"
    [showClear]="true"
    [maxDate]="today"
  />
</app-page-header>

@if (store.isLoading() && !store.sleeves().length) {
  <div class="card"><p-skeleton height="12rem" /></div>
} @else if (store.loadError()) {
  <div class="card"><p-message severity="error" text="Не вдалося завантажити позиції" /></div>
} @else if (!store.account()) {
  <div class="card">
    <app-empty-state icon="pi pi-wallet" title="Немає рахунку"
      ><p-button label="Відкрити рахунок" routerLink="/accounts/new"
    /></app-empty-state>
  </div>
} @else {
  @let totals = store.totals();
  <app-holdings-summary-card [totals]="totals" />

  <app-holdings-tiles [totals]="totals" />

  @if (store.exposure().length) {
    <app-holdings-exposure-card [breakdowns]="store.exposure()" [currency]="store.currency()" />
  }

  @if (store.staleQuotes()) {
    <p-message
      severity="warn"
      styleClass="mb-4"
      text="Частина котирувань застаріла або відсутня — вартість таких позицій може бути неточною."
    />
  }

  @for (sleeve of store.sleeves(); track sleeve.id) {
    <app-holdings-sleeve-card [sleeve]="sleeve" />
  } @empty {
    <div class="card">
      <app-empty-state
        icon="pi pi-chart-pie"
        title="Позицій ще немає"
        text="Імпортуйте positions.json на сторінці рахунку або відмітьте виконання в рапорті."
      />
    </div>
  }
}
