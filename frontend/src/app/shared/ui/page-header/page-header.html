<div class="flex flex-wrap items-start justify-between gap-3 sm:gap-4 mb-4 sm:mb-6">
  <div class="min-w-0">
    @if (backLink(); as link) {
      <button type="button" class="flex items-center gap-1 p-0 border-0 bg-transparent cursor-pointer text-sm text-primary mb-2" (click)="back(link)"><i class="pi pi-arrow-left text-xs"></i>{{ backTitle() }}</button>
    }
    <h1 class="text-2xl font-semibold m-0">{{ title() }}</h1>
    <!-- The subtitle explains the page; on a phone the screen goes to the content. It sits on the page's grey, not a
         card's white, so the light theme takes a shade darker than the muted colour to keep 4.5:1. -->
    @if (subtitle()) {
      <p class="hidden sm:block text-surface-600 dark:text-muted-color mt-1 mb-0">{{ subtitle() }}</p>
    }
  </div>
  <div class="flex flex-wrap items-center gap-2">
    <ng-content />
  </div>
</div>
