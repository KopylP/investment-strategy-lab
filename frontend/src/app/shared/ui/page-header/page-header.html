<div class="flex flex-wrap items-start justify-between gap-3 sm:gap-4 mb-4 sm:mb-6">
  <div class="min-w-0">
    <h1 class="text-2xl font-semibold m-0">{{ title() }}</h1>
    <!-- The subtitle explains the page; on a phone the screen goes to the content. -->

      <p class="hidden sm:block text-muted-color mt-1 mb-0">{{ subtitle() }}</p>
    }
  </div>
  <div class="flex flex-wrap items-center gap-2">
    <ng-content />
  </div>
</div>
