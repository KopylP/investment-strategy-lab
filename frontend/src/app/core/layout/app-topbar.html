<div class="layout-topbar">
  <div class="layout-topbar-logo-container">
    <button
      class="layout-menu-button layout-topbar-action"
      (click)="layout.onMenuToggle()"
      aria-label="Меню"
    >
      <i class="pi pi-bars"></i>
    </button>
    <a class="layout-topbar-logo" routerLink="/">
      <i class="pi pi-chart-scatter text-primary text-2xl"></i>
      <span>Investment Lab</span>
    </a>
  </div>

  <div class="layout-topbar-actions">
    @if (accounts.accounts().length > 1) {
      <p-select
        [options]="accountOptions()"
        optionLabel="name"
        optionValue="id"
        [ngModel]="selectedAccount()"
        (ngModelChange)="chooseAccount($event)"
        size="small"
        ariaLabel="Рахунок"
        class="hidden sm:flex self-center min-w-48"
      />
    } @else if (accounts.current(); as account) {
      <span class="hidden sm:inline text-muted-color self-center"
        >{{ account.name }} · {{ account.baseCurrency }}</span
      >
    }

    @if (display.code(); as code) {
      <p-selectbutton
        [options]="display.options"
        [ngModel]="code"
        (ngModelChange)="chooseCurrency($event)"
        [allowEmpty]="false"
        size="small"
        ariaLabel="Валюта відображення"
        pTooltip="Валюта відображення сум (за офіційним курсом)"
        tooltipPosition="bottom"
        class="self-center"
      />
    }

    <div class="layout-config-menu">
      <button
        type="button"
        class="layout-topbar-action"
        (click)="toggleDarkMode()"
        [attr.aria-label]="layout.isDarkTheme() ? 'Світла тема' : 'Темна тема'"
      >
        <i
          class="pi"
          [class.pi-moon]="layout.isDarkTheme()"
          [class.pi-sun]="!layout.isDarkTheme()"
        ></i>
      </button>
    </div>

    <button
      type="button"
      class="layout-topbar-action"
      (click)="menu.toggle($event)"
      [attr.aria-label]="email()"
    >
      <i class="pi pi-user"></i>
    </button>
    <p-menu #menu [model]="userMenu()" [popup]="true" appendTo="body">
      <ng-template #start>
        <div class="px-3 py-2 text-sm text-muted-color">{{ email() }}</div>
      </ng-template>
    </p-menu>
  </div>
</div>
