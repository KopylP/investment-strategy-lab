name: Weekly Risk Monitor

# Runs every Sunday after all markets have closed; act on the result on Monday.
on:
  schedule:
    - cron: "0 17 * * 0"
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: strategy-engine
    env:
      STRATEGY_CONFIG: src/finance_decisions/strategies/etf_momentum/config/strategy.toml
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: strategy-engine/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run risk monitor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CASH_ETF: ${{ vars.CASH_ETF }}
          STOP_LOSS_PCT: ${{ vars.STOP_LOSS_PCT }}
          DRAWDOWN_WARN: ${{ vars.DRAWDOWN_WARN }}
          DRAWDOWN_EXIT: ${{ vars.DRAWDOWN_EXIT }}
          MA_EXIT_BAND: ${{ vars.MA_EXIT_BAND }}
          VIX_WARN: ${{ vars.VIX_WARN }}
          VIX_EXIT: ${{ vars.VIX_EXIT }}
          PORTFOLIO_WARN: ${{ vars.PORTFOLIO_WARN }}
          PORTFOLIO_EXIT: ${{ vars.PORTFOLIO_EXIT }}
        run: PYTHONPATH=src python -m finance_decisions.strategies.etf_momentum.weekly_risk_monitor

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-risk-monitor-report
          path: strategy-engine/reports/latest/etf-momentum/weekly-risk-monitor
          retention-days: 90
