name: Monthly ETF Scanner

# Runs on the first Sunday of each month after all markets have closed, so every
# price is a full close. The plan is meant to be executed on Monday.
on:
  schedule:
    - cron: "0 18 * * 0"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: strategy-engine
    env:
      STRATEGY_CONFIG: src/finance_decisions/strategies/etf_momentum/config/strategy.toml
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Check first Sunday
        id: schedule_check
        # Runs before checkout, so strategy-engine/ does not exist yet.
        working-directory: .
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date -u +%d)" -le 07 ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repo
        if: steps.schedule_check.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Setup Python
        if: steps.schedule_check.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: strategy-engine/requirements*.txt

      - name: Install dependencies
        if: steps.schedule_check.outputs.should_run == 'true'
        run: pip install -r requirements.txt

      - name: Run monthly scanner
        if: steps.schedule_check.outputs.should_run == 'true'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ETF_LIST: ${{ vars.ETF_LIST }}
          CASH_ETF: ${{ vars.CASH_ETF }}
          MONTHLY_CONTRIBUTION: ${{ vars.MONTHLY_CONTRIBUTION }}
          TOP_N: ${{ vars.TOP_N }}
          LOOKBACK_MONTHS: ${{ vars.LOOKBACK_MONTHS }}
          SCANNER_MA_PERIOD: ${{ vars.SCANNER_MA_PERIOD }}
          MAX_VOLATILITY: ${{ vars.MAX_VOLATILITY }}
          MAX_DRAWDOWN: ${{ vars.MAX_DRAWDOWN }}
          MAX_VIX: ${{ vars.MAX_VIX }}
          MIN_SHARPE: ${{ vars.MIN_SHARPE }}
          MIN_MOMENTUM: ${{ vars.MIN_MOMENTUM }}
          HOLD_BUFFER_K: ${{ vars.HOLD_BUFFER_K }}
          MAX_PER_GROUP: ${{ vars.MAX_PER_GROUP }}
          WEAK_MARKET_INVEST_PCT: ${{ vars.WEAK_MARKET_INVEST_PCT }}
        run: PYTHONPATH=src python -m finance_decisions.strategies.etf_momentum.monthly_scanner

      - name: Upload report artifact
        if: always() && steps.schedule_check.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: monthly-scanner-report
          path: strategy-engine/reports/latest/etf-momentum/monthly-scanner
          retention-days: 90
