name: Strategy Engine

on:
  push:
    paths:
      - "strategy-engine/**"
      - ".github/workflows/strategy-engine.yml"
  pull_request:
    paths:
      - "strategy-engine/**"
      - ".github/workflows/strategy-engine.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: strategy-engine
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: strategy-engine/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest -q

      # The OpenAPI snapshot is the contract with .NET; it must be regenerated together with code changes.
      - name: Check contract snapshot is current
        run: |
          uv run python tools/export_contract.py
          git diff --exit-code -- contracts/
