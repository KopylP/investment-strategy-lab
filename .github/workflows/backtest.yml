name: Strategy Backtest

# Manual only: replay the strategy after changing rules or the ETF list.
on:
  workflow_dispatch:
    inputs:
      years:
        description: "Years to replay"
        default: "8"
      contribution:
        description: "Monthly contribution"
        default: "400"

jobs:
  backtest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: strategy-engine
    env:
      STRATEGY_CONFIG: src/finance_decisions/strategies/etf_momentum/config/strategy.toml
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: strategy-engine/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backtest
        run: >
          PYTHONPATH=src python -m finance_decisions.strategies.etf_momentum.backtest
          --years "${{ inputs.years }}" --contribution "${{ inputs.contribution }}"

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-report
          path: strategy-engine/reports/latest/etf-momentum/backtest
          retention-days: 90
