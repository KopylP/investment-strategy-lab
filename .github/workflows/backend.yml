name: Backend

on:
  push:
    paths:
      - "backend/**"
      - "strategy-engine/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "strategy-engine/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json

      # The AppHost starts the Python strategy engine through uv in integration tests.
      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: strategy-engine/uv.lock

      - name: Restore
        run: dotnet restore InvestmentLab.slnx

      - name: Build
        run: dotnet build InvestmentLab.slnx --no-restore --configuration Release

      # Integration tests start the Aspire AppHost; the hosted runner has Docker for Postgres.
      - name: Test
        run: dotnet test --solution InvestmentLab.slnx --no-build --configuration Release
