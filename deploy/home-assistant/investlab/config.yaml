name: Investment Lab
version: "1.0.183"
slug: investlab
description: Інвестиційні стратегії, щомісячні рапорти й облік портфеля (Revolut, податок Белка).
url: https://github.com/KopylP/investment-strategy-lab
# Home Assistant pulls the image GitHub Actions built for this version (.github/workflows/addon-release.yml) instead of
# building it on the device. Only the Raspberry Pi (aarch64) is built; deploy.sh drops this line for an on-device build.
image: ghcr.io/kopylp/investlab
arch:
  - aarch64
init: false
startup: application
boot: auto
# A backup copies /data, which holds the live PostgreSQL cluster: the Supervisor stops the add-on first (ADR-0030).
backup: cold
# Only the sidebar panel: the Supervisor proxies it to 8098 behind Home Assistant's login and HTTPS. No published port.
ingress: true
ingress_port: 8098
panel_icon: mdi:chart-line
panel_title: Investment Lab
# Notifications: a scheduled report is announced in Home Assistant (its Core API through the Supervisor).
homeassistant_api: true
# MCP (when mcp_enabled): the add-on installs its small integration into Home Assistant's config, which publishes
# /api/investlab/mcp on Home Assistant's own origin and forwards to 8098; clients sign in with Home Assistant's OAuth.
map:
  - type: homeassistant_config
    read_only: false
  # /share/investlab: moving the database between add-ons (export / import markers, see run.sh and DOCS.md).
  - type: share
    read_only: false
options:
  timezone: Europe/Warsaw
  mcp_enabled: false
schema:
  timezone: str
  mcp_enabled: bool
