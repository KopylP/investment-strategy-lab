name: Investment Lab
version: "1.0.11"
slug: investlab
description: Інвестиційні стратегії, щомісячні рапорти й облік портфеля (Revolut, податок Белка).
url: https://github.com/KopylP/investment-strategy-lab
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
# Sidebar panel through Home Assistant (its login, its HTTPS) on 8098; direct access on 8099/investlab.
ingress: true
ingress_port: 8098
panel_icon: mdi:chart-line
panel_title: Investment Lab
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: "Веб-інтерфейс: http(s)://homeassistant.local:8099/investlab"
map:
  - ssl:ro
options:
  ssl: false
  certfile: fullchain.pem
  keyfile: privkey.pem
  timezone: Europe/Warsaw
schema:
  ssl: bool
  certfile: str
  keyfile: str
  timezone: str
