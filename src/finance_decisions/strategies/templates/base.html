<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --paper: #f3f5f4;
      --surface: #ffffff;
      --ink: #1c2b33;
      --muted: #5a6971;
      --line: #d6dddb;
      --soft: #e9eeec;
      --buy: #17734a;
      --buy-soft: #e2f1e9;
      --sell: #a8382b;
      --sell-soft: #f8e5e1;
      --park: #7d5f17;
      --park-soft: #f4ecd6;
      --info: #2c4a94;
      --info-soft: #e5eaf7;
      --series-1: #2a78d6;
      --series-2: #eb6834;
      --series-3: #1baf7a;
      --series-4: #eda100;
      --series-cash: #a3aeb3;
      --code-bg: #1d2a31;
      --code-ink: #e3eaed;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --paper: #11191d;
        --surface: #182227;
        --ink: #e3e9eb;
        --muted: #9aa8ae;
        --line: #2b3a40;
        --soft: #1f2b31;
        --buy: #5cc48e;
        --buy-soft: #16301f;
        --sell: #f08b7b;
        --sell-soft: #3a1f1b;
        --park: #e0b75c;
        --park-soft: #33290f;
        --info: #93abf1;
        --info-soft: #1c2440;
        --series-1: #3987e5;
        --series-2: #d95926;
        --series-3: #199e70;
        --series-4: #c98500;
        --series-cash: #5d6a70;
        --code-bg: #0c1215;
      }
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --paper: #11191d;
      --surface: #182227;
      --ink: #e3e9eb;
      --muted: #9aa8ae;
      --line: #2b3a40;
      --soft: #1f2b31;
      --buy: #5cc48e;
      --buy-soft: #16301f;
      --sell: #f08b7b;
      --sell-soft: #3a1f1b;
      --park: #e0b75c;
      --park-soft: #33290f;
      --info: #93abf1;
      --info-soft: #1c2440;
      --series-1: #3987e5;
      --series-2: #d95926;
      --series-3: #199e70;
      --series-4: #c98500;
      --series-cash: #5d6a70;
      --code-bg: #0c1215;
    }

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Commissioner", system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 16px;
      line-height: 1.55;
    }
    main { max-width: 880px; margin: 0 auto; padding: 40px 16px 64px; }
    a { color: var(--info); }
    :focus-visible { outline: 3px solid var(--info); outline-offset: 2px; border-radius: 4px; }

    /* Type */
    h1 { font-size: 2.25rem; line-height: 1.15; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
    h2 { font-size: 1.25rem; line-height: 1.3; font-weight: 650; margin: 0 0 12px; }
    h3 { font-size: 1rem; font-weight: 650; margin: 0 0 4px; }
    p { margin: 0 0 10px; max-width: 68ch; }
    .lead { font-size: 1.125rem; color: var(--muted); margin-top: 8px; }
    .muted { color: var(--muted); }
    .small { font-size: 0.875rem; }
    .num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
    .green { color: var(--buy); }
    .red { color: var(--sell); }

    header.page { margin-bottom: 28px; }
    section.block { margin-top: 40px; }
    section.block > h2 { padding-bottom: 8px; border-bottom: 1px solid var(--line); }

    /* Verdict: the one-sentence answer, coloured by what it asks of you */
    .verdict {
      border-left: 6px solid var(--buy);
      background: var(--buy-soft);
      padding: 18px 20px;
      border-radius: 0 10px 10px 0;
    }
    .verdict.weak { border-left-color: var(--park); background: var(--park-soft); }
    .verdict.act { border-left-color: var(--sell); background: var(--sell-soft); }
    .verdict-line { font-size: 1.375rem; line-height: 1.3; font-weight: 650; margin: 0 0 8px; }
    .verdict ul { margin: 0; padding-left: 18px; color: var(--ink); }
    .verdict li + li { margin-top: 2px; }

    /* Order slip: numbered steps you tick off */
    .slip-list { list-style: none; margin: 0; padding: 0; }
    .slip { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
    .order {
      display: grid;
      grid-template-columns: 28px 98px minmax(0, 1fr) auto;
      gap: 4px 14px;
      align-items: start;
      padding: 16px 18px;
    }
    .order + .order { border-top: 1px solid var(--line); }
    .order input { width: 20px; height: 20px; margin: 3px 0 0; accent-color: var(--buy); cursor: pointer; }
    .order.done .order-main, .order.done .order-money { opacity: 0.45; text-decoration: line-through; }
    .verb { font-weight: 700; font-size: 0.9375rem; padding: 2px 0; white-space: nowrap; }
    .verb.sell { color: var(--sell); }
    .verb.buy { color: var(--buy); }
    .verb.park { color: var(--park); }
    .ticker { font-weight: 700; font-size: 1.0625rem; }
    .order-name { color: var(--muted); font-size: 0.9375rem; }
    .order-reason { font-size: 0.875rem; color: var(--muted); margin-top: 4px; }
    .order-money { text-align: right; }
    .amount { font-size: 1.25rem; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .shares { font-size: 0.875rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .slip-empty { padding: 18px; color: var(--muted); }
    .slip-total { display: flex; flex-wrap: wrap; gap: 6px 24px; padding: 12px 18px; border-top: 1px solid var(--line); background: var(--soft); border-radius: 0 0 12px 12px; font-size: 0.9375rem; }

    .order.simple { grid-template-columns: 28px minmax(0, 1fr); }
    .order.simple label { cursor: pointer; }
    .order.simple.done label { opacity: 0.45; text-decoration: line-through; }

    /* Position card with its distance-to-exit meter */
    .position { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; }
    .position + .position { margin-top: 12px; }
    .pos-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 8px; }
    .pos-figures { display: flex; flex-wrap: wrap; gap: 4px 22px; font-size: 0.9375rem; color: var(--muted); }
    .pos-figures strong { color: var(--ink); font-weight: 650; }
    .pos-figures strong.green { color: var(--buy); }
    .pos-figures strong.red { color: var(--sell); }
    .cushion { margin-top: 14px; }
    .cushion-label { margin: 0 0 6px; font-size: 0.9375rem; max-width: none; }
    .meter { height: 8px; border-radius: 4px; background: var(--soft); overflow: hidden; }
    .meter-fill { height: 100%; border-radius: 4px; background: var(--buy); min-width: 4px; }
    .meter-fill.yellow { background: var(--park); }
    .meter-fill.red { background: var(--sell); }
    table.levels { margin-top: 12px; font-size: 0.875rem; color: var(--muted); }
    table.levels td { padding: 4px 0; border: 0; }

    /* Notes */
    .notes { margin: 14px 0 0; padding: 0; list-style: none; }
    .notes li { padding: 10px 14px; background: var(--info-soft); border-radius: 8px; font-size: 0.9375rem; }
    .notes li + li { margin-top: 6px; }

    /* Allocation bar */
    .alloc-bar { display: flex; gap: 2px; height: 22px; margin: 4px 0 12px; }
    .alloc-seg { min-width: 3px; }
    .alloc-seg:first-child { border-radius: 4px 0 0 4px; }
    .alloc-seg:last-child { border-radius: 0 4px 4px 0; }
    .alloc-seg:only-child { border-radius: 4px; }
    .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 8px; vertical-align: baseline; }
    .s1 { background: var(--series-1); } .s2 { background: var(--series-2); }
    .s3 { background: var(--series-3); } .s4 { background: var(--series-4); }
    .s5 { background: #e87ba4; } .s6 { background: #008300; }
    .s7 { background: #6250d6; } .s8 { background: #e34948; }
    .s-cash { background: var(--series-cash); }

    /* Tables */
    .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
    table { width: 100%; border-collapse: collapse; font-size: 0.9375rem; }
    th, td { padding: 10px 12px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
    th { font-size: 0.8125rem; font-weight: 600; color: var(--muted); background: var(--soft); white-space: nowrap; }
    tr:last-child td { border-bottom: 0; }
    td .sub { display: block; font-size: 0.8125rem; color: var(--muted); }
    tr.is-picked td:first-child { box-shadow: inset 4px 0 0 var(--buy); }

    /* Pills carry state with a word, never colour alone */
    .pill { display: inline-block; font-size: 0.8125rem; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap; background: var(--soft); color: var(--muted); }
    .pill.green, .pill.selected { background: var(--buy-soft); color: var(--buy); }
    .pill.buffer { background: var(--info-soft); color: var(--info); }
    .pill.yellow, .pill.group_blocked { background: var(--park-soft); color: var(--park); }
    .pill.red { background: var(--sell-soft); color: var(--sell); }
    .pill.cash { background: var(--soft); color: var(--muted); }

    /* Key figures in a row, quiet */
    .figures { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 0; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
    .figure { padding: 14px 16px; }
    .figure + .figure { border-left: 1px solid var(--line); }
    .figure-label { font-size: 0.875rem; color: var(--muted); }
    .figure-value { font-size: 1.375rem; font-weight: 650; font-variant-numeric: tabular-nums; }
    .figure-note { font-size: 0.8125rem; color: var(--muted); }

    /* Steps that really are a sequence */
    ol.steps { margin: 0; padding-left: 22px; }
    ol.steps li { padding-left: 4px; }
    ol.steps li + li { margin-top: 8px; }
    dl.rules { display: grid; grid-template-columns: minmax(0, 220px) minmax(0, 1fr); gap: 8px 18px; margin: 0; }
    dl.rules dt { font-weight: 600; }
    dl.rules dd { margin: 0; color: var(--muted); }

    details { margin-top: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
    details > summary { cursor: pointer; padding: 14px 18px; font-weight: 600; list-style-position: inside; }
    details[open] > summary { border-bottom: 1px solid var(--line); }
    details > .details-body { padding: 16px 18px; }
    details > .table-wrap { border: 0; border-radius: 0 0 10px 10px; }
    pre { background: var(--code-bg); color: var(--code-ink); border-radius: 8px; padding: 14px; overflow: auto; font-size: 0.8125rem; line-height: 1.5; margin: 0; }

    footer.page { margin-top: 48px; color: var(--muted); font-size: 0.8125rem; }

    @media (max-width: 640px) {
      main { padding-top: 24px; }
      h1 { font-size: 1.75rem; }
      .verdict-line { font-size: 1.1875rem; }
      .order { grid-template-columns: 24px minmax(0, 1fr) auto; }
      .order input { grid-column: 1; grid-row: 1; }
      .order .verb { grid-column: 2; grid-row: 1; }
      .order .order-main { grid-column: 2 / 4; grid-row: 2; }
      .order .order-money { grid-column: 3; grid-row: 1; }
      .figure + .figure { border-left: 0; border-top: 1px solid var(--line); }
      dl.rules { grid-template-columns: 1fr; gap: 2px; }
      dl.rules dd { margin-bottom: 8px; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
    @media print {
      body { background: #fff; }
      details { break-inside: avoid; }
      details:not([open]) { display: none; }
    }
  </style>
</head>
<body>
  <main>
    {% block content %}{% endblock %}

    <details>
      <summary>Технічні дані (JSON)</summary>
      <div class="details-body"><pre>{{ payload | json_safe | json_dumps(indent=2) }}</pre></div>
    </details>
    <details>
      <summary>Текстова версія звіту</summary>
      <div class="details-body"><pre>{{ console_text }}</pre></div>
    </details>
    <footer class="page">Звіт згенеровано {{ generated_at }}. Це інструмент підтримки рішень, а не інвестиційна порада.</footer>
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
