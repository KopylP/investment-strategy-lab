[strategy]
currency = "USD"
# Where parked money waits: unfilled slots and the uninvested half in a weak market.
cash_etf = "BIL"
etfs = [
  "SPY",
  "QQQ",
  "IWM",
  "EFA",
  "EEM",
  "GLD",
  "SLV",
  "TLT",
  "IEF",
  "LQD",
  "VNQ",
  "USO",
  "DBA",
  "XLE",
  "XLK",
  "XLV",
  "XLF",
  "XLU",
]

[risk]
ma_period = 200
stop_loss_pct = -0.08
drawdown_warn = -0.10
drawdown_exit = -0.18
vix_warn = 25.0
vix_exit = 35.0
portfolio_warn = -0.10
portfolio_exit = -0.20
ma_exit_band = 0.02
small_loss_warn = -0.04

[scanner]
top_n = 4
lookback_months = 6
ma_period = 200
max_volatility = 0.35
max_drawdown = -0.20
max_vix = 30.0
min_sharpe = 0.20
min_momentum = 0.0
hold_buffer_k = 8
max_per_group = 1
risk_free_rate = 0.035
max_stale_days = 5

[plan]
# Set this to the amount you add every month (USD). Override with --contribution or MONTHLY_CONTRIBUTION.
monthly_contribution = 400.0
weak_market_invest_pct = 0.5
trim_band = 0.10
min_trade = 25.0
fractional_shares = true

[backtest]
years = 15
cost_pct = 0.0005
fee_per_trade = 0.0
benchmark = "SPY"

# ETFs in the same group move together; the scanner picks at most max_per_group from each.
[groups]
"SPY" = "Акції США: S&P 500"
"QQQ" = "Технології США / Nasdaq-100"
