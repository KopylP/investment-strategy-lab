[strategy]
currency = "EUR"
# Where parked money waits: unfilled slots and the uninvested half in a weak market.
cash_etf = "XEON.DE"
etfs = [
  "SXR8.DE",
  "SXRV.DE",
  "IUSN.DE",
  "EUN2.DE",
  "IS3N.DE",
  "4GLD.DE",
  "SXRS.DE",
  "IS04.DE",
  "IUS7.DE",
  "IBCI.DE",
  "IQQA.DE",
  "XDJE.DE",
  "QDVE.DE",
  "QDVF.DE",
  "QDVG.DE",
  "QDVI.DE",
  "NQSE.DE",
]

[risk]
ma_period = 200
stop_loss_pct = -0.08
drawdown_warn = -0.10
drawdown_exit = -0.18
vix_warn = 25.0
vix_exit = 35.0
portfolio_warn = -0.10
portfolio_exit = -0.20
ma_exit_band = 0.02
small_loss_warn = -0.04

[scanner]
top_n = 4
lookback_months = 6
ma_period = 200
max_volatility = 0.35
max_drawdown = -0.20
max_vix = 30.0
min_sharpe = 0.20
min_momentum = 0.0
hold_buffer_k = 8
max_per_group = 1
risk_free_rate = 0.02
max_stale_days = 5

[plan]
# Set this to the amount you add every month (EUR). Override with --contribution or MONTHLY_CONTRIBUTION.
monthly_contribution = 400.0
weak_market_invest_pct = 0.5
trim_band = 0.10
min_trade = 25.0
fractional_shares = true

[backtest]
years = 10
cost_pct = 0.001
fee_per_trade = 1.0
benchmark = "SXR8.DE"

# ETFs in the same group move together; the scanner picks at most max_per_group from each.
[groups]
"SXR8.DE" = "Акції США: S&P 500"
"SXRV.DE" = "Технології США / Nasdaq-100"
